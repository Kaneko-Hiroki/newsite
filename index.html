<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HADO Deck Experience</title>
  <style>
    :root { --blue:#0a33dd; --deep:#041b64; --line:#bfcbfb; --paper:#f8faff; }
    * { box-sizing: border-box; }
    html,body { margin:0; height:100%; overflow:hidden; font-family:"Noto Sans JP",system-ui,sans-serif; background:#000; }
    #gl { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
    .noise { position:fixed; inset:0; pointer-events:none; opacity:.08; background-image:radial-gradient(#fff 1px,transparent 1px); background-size:3px 3px; mix-blend-mode:overlay; z-index:2; }
    .ui { position:fixed; inset:0; z-index:3; color:#061032; pointer-events:none; }
    .stage { position:absolute; inset:5vh 5vw; border:1px solid rgba(120,145,235,.35); background:rgba(255,255,255,.9); backdrop-filter:blur(3px); overflow:hidden; }
    .slides { position:relative; height:100%; width:100%; }
    .slide { position:absolute; inset:0; padding:4rem; opacity:0; transform:translateY(30px) scale(.98); transition:.6s cubic-bezier(.2,.8,.2,1); }
    .slide.active { opacity:1; transform:translateY(0) scale(1); }
    .dark { color:#fff; background:linear-gradient(140deg,#03124a 0%,#072ca8 100%); }
    .light { background:linear-gradient(160deg,#fff 0%,#f5f8ff 100%); }
    .num { font-size:1.1rem; letter-spacing:.35em; color:var(--blue); font-weight:800; }
    .title { font-size:clamp(2rem,7vw,8rem); line-height:1; margin:.6rem 0 1rem; font-weight:900; }
    .sub { font-size:clamp(1rem,2vw,1.8rem); max-width:80ch; line-height:1.7; }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin-top:2rem; }
    .card { border:1px solid #c2cffc; border-radius:14px; padding:1.2rem; background:rgba(255,255,255,.88); min-height:130px; }
    .dark .card { color:#081746; }
    .hud { position:absolute; right:6vw; bottom:4vh; font-size:1rem; letter-spacing:.3em; font-weight:700; color:#c6d3ff; }
    .help { position:absolute; left:6vw; bottom:4vh; font-size:.86rem; letter-spacing:.08em; color:#8ca4ff; }
    .progress { position:absolute; left:0; right:0; bottom:0; height:6px; background:rgba(180,200,255,.2); }
    .progress b { display:block; height:100%; width:0; background:linear-gradient(90deg,#1657ff,#3ea0ff); }
  </style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="noise"></div>
<div class="ui">
  <div class="stage">
    <div class="slides" id="slides"></div>
    <div class="hud" id="hud">01 / 20</div>
    <div class="help">DRAG / WHEEL / ↑ ↓ で操作</div>
    <div class="progress"><b id="bar"></b></div>
  </div>
</div>
<script>
const deck = [
  ["世界を前に進める 表現者へ","HADOは、AI MARKETING FUNDになる。","light"],
  ["Contents","Who we are / Mission & Vision / AI Marketing Fund ...","light"],
  ["Who we are","私たちは何者か","dark"],
  ["私たちは、世界を前に進める、表現者だ。","AIで創れる範囲を、桁違いに広げる。","light"],
  ["一緒に、表現者になろう。","インターネット登場以来の大きな転換点。","light"],
  ["Mission & Vision","使命と目指す未来","dark"],
  ["AIとマーケティングで、いくつもの社会課題を解く。","次の100年のスタンダードを創る。","light"],
  ["2030年、売上100億円。","確かなマーケティング力 × 最新AIへの投資 × 新規事業","light"],
  ["AI Marketing Fund.","新しいポジショニング","light"],
  ["日本初の、AI Marketing Fund.","投資と実行の真ん中で。","light"],
  ["Why Now","技術転換期と、マーケが効く理由","dark"],
  ["いま、「できる」の境界線が毎月、書き換わる。","AIで実現できる範囲が、5年前と比べて桁違いに広がった。","light"],
  ["届けて、はじめて社会の課題は解ける。","作れるだけでは価値にならない。","light"],
  ["Track Record","マーケティング実績","dark"],
  ["Numbers","100+ Clients / 200万+ Reach / 800万+ Engagement","light"],
  ["Clients","様々な業界のリーディングブランドと、結果にコミット。","light"],
  ["Owned Media","SNSの爆発的な広がりとSEOの深さ。","light"],
  ["Case Study","表面的な改善だけでなく事業の利益に貢献。","light"],
  ["Business","現在と未来の事業","dark"],
  ["HR Marketing","「面接が来ない」「広告費だけ消える」をAIで解く。","light"]
];
const slidesEl = document.getElementById('slides');
deck.forEach((d,i)=>{const s=document.createElement('section');s.className='slide '+d[2];s.innerHTML=`<div class="num">${String(i+1).padStart(2,'0')} CHAPTER</div><h1 class="title">${d[0]}</h1><p class="sub">${d[1]}</p><div class="cards"><div class="card">AI</div><div class="card">MARKETING</div><div class="card">NEW VENTURES</div></div>`;slidesEl.appendChild(s);});
const nodes=[...document.querySelectorAll('.slide')];const hud=document.getElementById('hud');const bar=document.getElementById('bar');
let idx=0,acc=0,lock=false;
function paint(){nodes.forEach((n,i)=>n.classList.toggle('active',i===idx));hud.textContent=`${String(idx+1).padStart(2,'0')} / ${deck.length}`;bar.style.width=((idx+1)/deck.length*100)+'%';}
function step(dir){if(lock) return; lock=true; idx=Math.max(0,Math.min(deck.length-1,idx+dir)); paint(); setTimeout(()=>lock=false,350);}
window.addEventListener('wheel',e=>{acc+=e.deltaY; if(Math.abs(acc)>120){step(acc>0?1:-1); acc=0;}});
window.addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key)) step(1); if(['ArrowUp','PageUp'].includes(e.key)) step(-1);});
let sx=0,drag=0;window.addEventListener('pointerdown',e=>sx=e.clientY);window.addEventListener('pointermove',e=>{if(!sx)return;drag=e.clientY-sx;});window.addEventListener('pointerup',()=>{if(Math.abs(drag)>50)step(drag<0?1:-1);sx=0;drag=0;});
paint();

const c=document.getElementById('gl');const gl=c.getContext('webgl');
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision mediump float;uniform vec2 r;uniform float t;uniform float s;float n(vec2 p){return fract(sin(dot(p,vec2(27.1,61.7)))*43758.5);}void main(){vec2 uv=(gl_FragCoord.xy*2.-r)/min(r.x,r.y);float a=atan(uv.y,uv.x);float d=length(uv);float rings=sin(38.*d-t*0.7+s*0.2);float rays=sin(a*8.+t*0.3);float spl=pow(max(0.,1.-d),2.);vec3 col=mix(vec3(.02,.07,.25),vec3(.02,.28,.95),spl+.15*rings+.08*rays);col+=.05*n(uv*120.+t);gl_FragColor=vec4(col,1.);} `;
function mk(type,src){const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);return sh;}
const pr=gl.createProgram();gl.attachShader(pr,mk(gl.VERTEX_SHADER,vs));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const ur=gl.getUniformLocation(pr,'r'),ut=gl.getUniformLocation(pr,'t'),us=gl.getUniformLocation(pr,'s');
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height);}addEventListener('resize',resize);resize();
let time=0;function loop(){time+=0.016;gl.uniform2f(ur,c.width,c.height);gl.uniform1f(ut,time);gl.uniform1f(us,idx);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(loop);}loop();
</script>
</body>
</html>
