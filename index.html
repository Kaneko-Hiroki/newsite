<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HADO Recruiting</title>
  <style>
    /* ===== v1.0.0: design tokens ===== */
    :root {
      --blue: #0b39ea;
      --line: #d7defa;
      --text: #0f1117;
      --muted: #3a3e4e;
      --bg: #fdfdff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }

    /* ===== v1.1.0: header ===== */
    .site-header {
      height: 74px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      padding-left: 40px;
      background: #fff;
      position: relative;
      z-index: 20;
    }
    .logo {
      display: flex;
      align-items: center;
      letter-spacing: .1em;
      font-size: 48px;
      font-weight: 800;
    }
    .nav { display: flex; }
    .nav a {
      text-decoration: none;
      color: #111;
      padding: 0 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 33px;
      line-height: 1;
      font-weight: 700;
    }
    .nav small {
      font-size: 12px;
      margin-top: 8px;
      color: #222;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .nav .entry {
      background: var(--blue);
      color: #fff;
      min-width: 220px;
      position: relative;
    }
    .nav .entry small { color: #fff; }
    .nav .entry::after {
      content: "→";
      position: absolute;
      right: 26px;
      top: 22px;
      font-size: 35px;
      font-weight: 500;
    }

    /* ===== v1.2.0: hero layout ===== */
    .hero {
      position: relative;
      min-height: calc(100vh - 74px);
      padding: 70px 0 35px 74px;
      isolation: isolate;
    }
    .left {
      position: relative;
      z-index: 6;
      width: 58%;
      max-width: 950px;
    }
    .eyebrow {
      color: var(--blue);
      font-size: 44px;
      font-weight: 800;
      margin: 0;
      letter-spacing: .02em;
    }
    .eyebrow::after {
      content: "";
      width: 50px;
      height: 6px;
      background: var(--blue);
      display: block;
      margin-top: 17px;
    }
    .title-image {
      width: min(86%, 1020px);
      margin-top: 36px;
      display: block;
    }
    .lead {
      margin: 34px 0 8px;
      font-size: 50px;
      font-weight: 500;
      letter-spacing: .01em;
    }
    .lead strong { color: var(--blue); font-weight: 800; }
    .sub {
      margin: 0;
      font-size: 43px;
      line-height: 1.62;
      color: #1a1d27;
      letter-spacing: .01em;
    }
    .tag {
      margin-top: 24px;
      display: inline-block;
      background: #07080f;
      color: #fff;
      font-size: 43px;
      letter-spacing: .04em;
      padding: 7px 16px;
    }
    .buttons {
      margin-top: 44px;
      display: flex;
      gap: 28px;
      padding-bottom: 20px;
    }
    .btn {
      min-width: 430px;
      height: 110px;
      border: 2px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 42px;
      font-weight: 700;
      position: relative;
    }
    .btn .arrow {
      position: absolute;
      right: 34px;
      font-size: 52px;
      line-height: .7;
      font-weight: 400;
    }
    .btn.primary { background: var(--blue); color: #fff; }
    .btn.secondary { color: var(--blue); background: #fff; }

    /* ===== v1.3.0: right visual ===== */
    .visual {
      position: absolute;
      right: -60px;
      top: 0;
      width: 58%;
      height: 100%;
      z-index: 2;
      background: url('https://images.unsplash.com/photo-1541216970279-affbfdd55aa2?auto=format&fit=crop&w=1500&q=80') right center / cover no-repeat;
      filter: grayscale(1) contrast(1.1);
      clip-path: inset(0 0 0 12%);
    }
    .visual::before {
      content: "";
      position: absolute;
      left: 28%;
      top: 0;
      width: 190px;
      height: 70%;
      background: var(--blue);
      mix-blend-mode: multiply;
      opacity: .95;
    }
    .visual::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 220px;
      height: 280px;
      background: var(--blue);
      clip-path: polygon(0 0,100% 0,100% 100%,20% 70%);
      opacity: .9;
    }

    /* decorative lines */
    .dots { position: absolute; width: 220px; height: 160px; background-image: radial-gradient(#9db3ff 1.4px, transparent 1.4px); background-size: 20px 20px; opacity: .95; z-index: 3; }
    .d1 { left: 51%; top: 56px; }
    .d2 { right: 66px; top: 126px; }
    .d3 { right: 78px; top: 420px; }
    .wire, .wire2, .wire3 {
      position: absolute;
      border: 1px solid #9cb2ff;
      opacity: .8;
      z-index: 3;
    }
    .wire { right: 250px; top: 16px; width: 560px; height: 900px; }
    .wire2 { left: 52%; top: 420px; width: 450px; height: 620px; }
    .wire3 { right: -210px; top: 130px; width: 860px; height: 860px; transform: rotate(45deg); }

    .splash {
      position: absolute;
      left: -120px;
      bottom: -170px;
      width: 66%;
      height: 52%;
      background: radial-gradient(circle at 32% 25%, rgba(13,64,238,.8) 0%, rgba(13,64,238,.7) 28%, rgba(13,64,238,.2) 49%, rgba(13,64,238,0) 70%);
      z-index: 1;
      filter: blur(2px);
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="logo">HADO</div>
      <nav class="nav">
        <a href="#">ABOUT<small>私たちについて</small></a>
        <a href="#">CULTURE<small>カルチャー</small></a>
        <a href="#">WORK<small>事業・仕事を知る</small></a>
        <a href="#">MEMBER<small>メンバー紹介</small></a>
        <a class="entry" href="#">ENTRY<small>エントリー</small></a>
      </nav>
    </header>

    <main class="hero">
      <div class="visual" aria-hidden="true"></div>
      <div class="dots d1" aria-hidden="true"></div>
      <div class="dots d2" aria-hidden="true"></div>
      <div class="dots d3" aria-hidden="true"></div>
      <div class="wire" aria-hidden="true"></div>
      <div class="wire2" aria-hidden="true"></div>
      <div class="wire3" aria-hidden="true"></div>
      <div class="splash" aria-hidden="true"></div>

      <section class="left">
        <p class="eyebrow">HADO RECRUITING</p>
        <img class="title-image" src="https://dummyimage.com/1200x500/ffffff/111111.png&text=%E4%B8%96%E7%95%8C%E3%82%92%E5%89%8D%E3%81%AB%E9%80%B2%E3%82%81%E3%82%8B%0A%E8%A1%A8%E7%8F%BE%E8%80%85%E3%81%B8%E3%80%82" alt="世界を前に進める表現者へ。" />
        <p class="lead"><strong>HADO</strong> は、 <strong>AI MARKETING FUND</strong>へ。</p>
        <p class="sub">AIとマーケティングの力で事業を創造し、<br />爆速で意思決定し、爆速で成長する。<br />M&amp;A・新規事業創出を通じて、社会課題を解く。</p>
        <div class="tag">AI × Marketing × New Ventures</div>

        <div class="buttons">
          <a class="btn primary" href="#">募集職種を見る <span class="arrow">→</span></a>
          <a class="btn secondary" href="#">会社を知る <span class="arrow">→</span></a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
